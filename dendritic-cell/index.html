<!DOCTYPE html>
<html lang="ja">
  <head>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>

    <meta charset="UTF-8" />
    <title>樹状細胞</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #222;
      }

      model-viewer {
        width: 80vw;
        height: 80vh;
      }

      .hint-text {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #ddd;
        font-size: 13px;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", sans-serif;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 14px;
        border-radius: 4px;
        pointer-events: none;
        text-align: center;
        max-width: 90vw;
        z-index: 10;
      }

      .custom-ar-button {
        position: absolute;
        bottom: 16px;
        right: 16px;
        width: 150px;
        height: 150px;
        background-color: white;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .custom-ar-button img {
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="hint-text">
      ARで表示後、ピンチで拡大・縮小できます
    </div>
    <model-viewer
      preload
      src="/dendritic-cell/model.glb"
      ios-src="/dendritic-cell/model.usdz"
      auto-rotate
      camera-controls
      ar
      ar-modes="scene-viewer webxr quick-look"
      alt="樹状細胞"
    >
      <button slot="ar-button" class="custom-ar-button">
        <img src="/button_icon/camera_icon.png" alt="AR">
      </button>
    </model-viewer>
  </body>
</html>
